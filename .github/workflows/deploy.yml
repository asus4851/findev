name: Deploy to GitHub Pages

# Запускается после завершения CI (ci.yml) на push в main: собирает приложение и публикует его на GitHub Pages.
# Если линт или хотя бы один тест в CI упал, деплой не происходит.
# Ручной запуск (workflow_dispatch) публикует текущий main без ожидания CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новая публикация отменяет предыдущую, которая ещё не завершилась.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Только успешный CI именно на push (а не на pull request из ветки с именем main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # Собирается ровно тот коммит, который проверил CI, даже если в main уже успели запушить новый.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/market/market-gen-as/package-lock.json
            backend/market/worker/package-lock.json
            frontend/package-lock.json

      # Wasm собирается из AssemblyScript во время prebuild фронтенда, а воркер импортирует rxjs
      # из своей папки, поэтому зависимости нужны в каждом пакете, который попадает в сборку.
      - run: npm ci
        working-directory: backend/market/market-gen-as
      - run: npm ci
        working-directory: backend/market/worker
      - run: npm ci
        working-directory: frontend

      # На Pages сайт живёт по адресу /<имя-репозитория>/, поэтому base href берётся из имени репозитория.
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
        working-directory: frontend

      # Pages не знает о маршрутах Angular: при прямом переходе на /settings отдаёт 404.html,
      # поэтому копия index.html заставляет приложение загрузиться и самому обработать адрес.
      - run: cp index.html 404.html
        working-directory: frontend/dist/frontend/browser

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
