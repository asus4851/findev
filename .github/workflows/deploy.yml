name: Deploy to GitHub Pages

# Кожен push у main перевіряє код (лінт, тести), збирає застосунок і публікує його на GitHub Pages.
# Якщо лінт або хоч один тест падає, деплой не відбувається.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Нова публікація скасовує попередню, яка ще не завершилась.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/market/market-gen-as/package-lock.json
            backend/market/market-gen-ts/package-lock.json
            backend/market/worker/package-lock.json
            frontend/package-lock.json

      # Wasm збирається з AssemblyScript під час prebuild фронтенду, а воркер імпортує rxjs
      # зі своєї папки, тому залежності потрібні в кожному пакеті.
      - run: npm ci
        working-directory: backend/market/market-gen-as
      - run: npm ci
        working-directory: backend/market/market-gen-ts
      - run: npm ci
        working-directory: backend/market/worker
      - run: npm ci
        working-directory: frontend

      # Межі доменів: імпорт лише через публічні index.ts.
      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test Wasm generator
        run: npm test
        working-directory: backend/market/market-gen-as
      - name: Test TypeScript generator
        run: npm test
        working-directory: backend/market/market-gen-ts
      - name: Test worker and contracts
        run: npm test
        working-directory: backend/market/worker
      - name: Test Angular
        run: npm test -- --watch=false
        working-directory: frontend

      # На Pages сайт живе за адресою /<назва-репозиторію>/, тому base href береться з назви репозиторію.
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
        working-directory: frontend

      # Pages не знає про маршрути Angular: для прямого переходу на /settings віддає 404.html,
      # тож копія index.html змушує застосунок завантажитися і сам обробити адресу.
      - run: cp index.html 404.html
        working-directory: frontend/dist/frontend/browser

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
