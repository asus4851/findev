name: Deploy to GitHub Pages

# Каждый push в main проверяет код (линт, тесты), собирает приложение и публикует его на GitHub Pages.
# Если линт или хотя бы один тест падает, деплой не происходит.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новая публикация отменяет предыдущую, которая ещё не завершилась.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/market/market-gen-as/package-lock.json
            backend/market/market-gen-ts/package-lock.json
            backend/market/worker/package-lock.json
            frontend/package-lock.json

      # Wasm собирается из AssemblyScript во время prebuild фронтенда, а воркер импортирует rxjs
      # из своей папки, поэтому зависимости нужны в каждом пакете.
      - run: npm ci
        working-directory: backend/market/market-gen-as
      - run: npm ci
        working-directory: backend/market/market-gen-ts
      - run: npm ci
        working-directory: backend/market/worker
      - run: npm ci
        working-directory: frontend

      # Границы доменов: импорт только через публичные index.ts.
      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test Wasm generator
        run: npm test
        working-directory: backend/market/market-gen-as
      - name: Test TypeScript generator
        run: npm test
        working-directory: backend/market/market-gen-ts
      - name: Test worker and contracts
        run: npm test
        working-directory: backend/market/worker
      - name: Test Angular
        run: npm test -- --watch=false
        working-directory: frontend

      # На Pages сайт живёт по адресу /<имя-репозитория>/, поэтому base href берётся из имени репозитория.
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
        working-directory: frontend

      # Pages не знает о маршрутах Angular: при прямом переходе на /settings отдаёт 404.html,
      # поэтому копия index.html заставляет приложение загрузиться и самому обработать адрес.
      - run: cp index.html 404.html
        working-directory: frontend/dist/frontend/browser

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
