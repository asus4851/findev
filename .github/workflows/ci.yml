name: CI

# Один процесс: сборка → линт и тесты → публикация на GitHub Pages.
# На pull request выполняются сборка и проверки, без публикации.
# Если сборка, линт или хотя бы один тест падает, деплой не происходит.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит в той же ветке отменяет предыдущий запуск, в том числе незавершённую публикацию.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/market/market-gen-as/package-lock.json
            backend/market/worker/package-lock.json
            frontend/package-lock.json

      # Wasm собирается из AssemblyScript во время prebuild фронтенда, а воркер импортирует rxjs
      # из своей папки, поэтому зависимости нужны в каждом пакете, который попадает в сборку.
      - run: npm ci
        working-directory: backend/market/market-gen-as
      - run: npm ci
        working-directory: backend/market/worker
      - run: npm ci
        working-directory: frontend

      # На Pages сайт живёт по адресу /<имя-репозитория>/, поэтому base href берётся из имени репозитория.
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
        working-directory: frontend

      # Pages не знает о маршрутах Angular: при прямом переходе на /settings отдаёт 404.html,
      # поэтому копия index.html заставляет приложение загрузиться и самому обработать адрес.
      - run: cp index.html 404.html
        working-directory: frontend/dist/frontend/browser

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist/frontend/browser

  # Границы доменов: импорт только через публичные index.ts.
  lint:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint

  test-ts-generator:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/market/market-gen-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/market/market-gen-ts/package-lock.json
      - run: npm ci
      - name: Test TypeScript generator
        run: npm test

  test-wasm-generator:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/market/market-gen-as
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/market/market-gen-as/package-lock.json
      - run: npm ci
      - name: Test Wasm generator
        run: npm test

  test-worker:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/market/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/market/worker/package-lock.json
      - run: npm ci
      - name: Test worker and contracts
        run: npm test

  test-frontend:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test Angular
        run: npm test -- --watch=false

  deploy:
    needs: [build, lint, test-ts-generator, test-wasm-generator, test-worker, test-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
