<section class="toolbar">
  <div class="status">
    <span class="badge" [attr.data-state]="session.state()">{{ stateLabel() }}</span>
    <span class="details">
      {{ settings().instrumentCount }} instruments ·
      {{ settings().updatesPerBatch | number }} updates every {{ settings().batchIntervalMs | number }} ms ·
      {{ updatesPerSecond() | number: '1.0-0' }} updates/s
    </span>
  </div>
  <button type="button" (click)="toggle()" [disabled]="!canToggle()">
    {{ session.state() === 'paused' ? 'Resume' : 'Pause' }}
  </button>
</section>

@if (session.error(); as error) {
  <p class="error" role="alert">{{ error }}</p>
}

<app-data-table
  [columns]="columns"
  [rows]="session.rows()"
  rowKey="symbol"
  emptyText="Waiting for the market data…"
/>
