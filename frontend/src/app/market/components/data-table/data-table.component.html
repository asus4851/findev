<div class="scroll">
  <table>
    <thead>
      <tr>
        @for (column of columns(); track column.field) {
          <th scope="col" [class.num]="column.numeric">{{ column.header }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row[rowKey()]) {
        <tr>
          @for (column of columns(); track column.field; let first = $first) {
            @if (first) {
              <th scope="row">{{ cell(row, column) }}</th>
            } @else {
              <td [class.num]="column.numeric">{{ cell(row, column) }}</td>
            }
          }
        </tr>
      } @empty {
        <tr>
          <td class="empty" [attr.colspan]="columns().length">{{ emptyText() }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
